name: Installer checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Test-OfflineFix.ps1
      - name: PowerShell 7
        shell: pwsh
        run: .\tests\Test-OfflineFix.ps1
